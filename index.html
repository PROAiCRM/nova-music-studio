let dbHandle=null;let toastTimer=null;const audio=new Audio();audio.preload='metadata';audio.setAttribute('playsinline','');
function dbOpen(){if(dbHandle)return dbHandle;dbHandle=new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB не поддерживается'));return}let r=indexedDB.open('nova-music-studio-v9',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('songs'))r.result.createObjectStore('songs',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('База недоступна'))});return dbHandle}
async function getAll(){let db=await dbOpen();return new Promise((res,rej)=>{let r=db.transaction('songs','readonly').objectStore('songs').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function put(row){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction('songs','readwrite');tx.objectStore('songs').put(row);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Запись прервана'))})}
async function remove(id){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction('songs','readwrite');tx.objectStore('songs').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
// NOVA 011: writes an entire validated restore as one IndexedDB transaction.
// No existing record may be silently replaced by a backup.
async function putBatchAtomic(rows){
  if(!rows.length)return;
  const db=await dbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('songs','readwrite');
    const store=tx.objectStore('songs');
    try{for(const row of rows)store.add(row)}catch(e){tx.abort();reject(e);return}
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error('Ошибка восстановления'));
    tx.onabort=()=>reject(tx.error||new Error('Восстановление отменено'));
  });
}
async function getRow(id){
  const db=await dbOpen();
  return new Promise((resolve,reject)=>{
    const rq=db.transaction('songs','readonly').objectStore('songs').get(id);
    rq.onsuccess=()=>resolve(rq.result);
    rq.onerror=()=>reject(rq.error||new Error('Ошибка чтения'));
  });
}
async function hashBlob(blob){
  if(!globalThis.crypto?.subtle)throw new Error('SHA-256 недоступен: открой NOVA по HTTPS');
  const hash=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());
  return Array.from(new Uint8Array(hash),n=>n.toString(16).padStart(2,'0')).join('');
}
function decodeBase64(value){
  if(typeof value!=='string'||value.length%4!==0||!/^[A-Za-z0-9+/]*={0,2}$/.test(value))throw Error('Повреждённое аудио в архиве');
  const raw=atob(value); const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  return bytes;
}
async function testLocalStorage(){
  if(state.busy)return;
  state.busy=true;
  const id='__nova-011-check-'+sid();
  let completed=false;
  try{
    const sample=new Uint8Array([82,73,70,70,4,0,0,0,87,65,86,69,116,101,115,116]);
    const probe={id,title:'NOVA 011 · временный тест',created:Date.now(),updated:Date.now(),audio:new Blob([sample],{type:'audio/wav'}),mediaType:'audio/wav',probe:true};
    await put(probe);
    const saved=await getRow(id);
    const actual=saved?.audio?new Uint8Array(await saved.audio.arrayBuffer()):null;
    if(!actual||actual.length!==sample.length||actual.some((b,i)=>b!==sample[i]))throw Error('Файл не совпадает после сохранения');
    await remove(id);
    if(await getRow(id))throw Error('Временный тест не удалился');
    completed=true;
    state.storageCheckResult='PASS · IndexedDB сохранила и прочитала тестовый файл. Обычные проекты не затронуты. Долговременное хранение после закрытия Safari нужно проверить отдельно.';
  }catch(e){
    state.storageCheckResult='FAIL · '+e.message+'. Проверь доступ к хранилищу и свободное место.';
  }finally{
    if(!completed){try{await remove(id)}catch{}}
    state.busy=false;
    const box=$('#storage-check-result');if(box)box.textContent=state.storageCheckResult;
    toast(completed?'Проверка IndexedDB: PASS':'Проверка IndexedDB: FAIL');
  }
}

// NOVA 012. Two-phase non-destructive persistence proof on synthetic PCM WAV.
// Phase A writes an isolated probe to the existing IndexedDB, then the user closes/reopens Safari.
// Phase B reads it back and compares SHA-256 before removing ONLY the probe.
const NOVA12_PROOF_KEY='nova12.storage-proof.v1';
const NOVA12_BOOT_ID=sid();
let nova12ProofState='NOT_STARTED';
function nova12ProofMarker(){
  try {const v=JSON.parse(localStorage.getItem(NOVA12_PROOF_KEY)||'null');
    if(v&&typeof v.id==='string'&&v.id.startsWith('__nova12-proof-')&&/^[a-f0-9]{64}$/i.test(v.sha256)&&Number.isSafeInteger(v.size)&&v.size>44)return v;
  }catch{}return null;
}
function nova12Wav(){
  const sampleRate=8000, frames=2400, pcmBytes=frames*2;
  const arr=new ArrayBuffer(44+pcmBytes), view=new DataView(arr), bytes=new Uint8Array(arr);
  const text=(o,s)=>{for(let i=0;i<s.length;i++)bytes[o+i]=s.charCodeAt(i)};
  text(0,'RIFF');view.setUint32(4,36+pcmBytes,true);text(8,'WAVE');text(12,'fmt ');
  view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate*2,true);
  view.setUint16(32,2,true);view.setUint16(34,16,true);
  text(36,'data');view.setUint32(40,pcmBytes,true);
  for(let i=0;i<frames;i++)view.setInt16(44+i*2,Math.round(Math.sin(2*Math.PI*440*i/sampleRate)*4000),true);
  return new Blob([arr],{type:'audio/wav'});
}
function nova12RefreshProofUI(){
  const info=document.getElementById('nova12-proof-info');
  const begin=document.getElementById('nova12-proof-begin');
  const verify=document.getElementById('nova12-proof-verify');
  if(!info||!begin||!verify)return;
  const pending=nova12ProofMarker();
  begin.disabled=Boolean(pending);
  verify.disabled=!pending;
  if(!pending){info.textContent=nova12ProofState==='PASS'?'PASS · Файл сохранился после повторного открытия. Контрольная сумма совпала; временные данные очищены.':nova12ProofState==='FAIL'?'FAIL · Проверка не завершилась. Прочитай сообщение и повтори тест.':'Не запущен. Создаёт временный звуковой файл без изменений пользовательских песен.';return}
  if(pending.bootId===NOVA12_BOOT_ID){info.textContent='ШАГ 1/2 ГОТОВ · Тестовая запись сохранена. Закрой Safari, открой эту же ссылку и нажми «Проверить». До повторного открытия PASS не ставится.'}
  else {info.textContent='ШАГ 2/2 · Запись ожидает проверки после повторного открытия приложения. Нажми «Проверить».'}
}
async function nova12StartProof(){
 if(state.busy)return;
 if(nova12ProofMarker()){toast('Проверка уже начата. Повторно открой приложение.');return}
 state.busy=true;
 const id='__nova12-proof-'+sid(), sample=nova12Wav();
 try{
   const sha256=await hashBlob(sample);
   await put({id,title:'NOVA 012 · служебная запись',created:Date.now(),updated:Date.now(),probe:true,audio:sample,mediaType:'audio/wav'});
   const dbRow=await getRow(id);
   if(!dbRow?.audio||(await hashBlob(dbRow.audio))!==sha256)throw Error('Тестовая запись не совпала сразу после сохранения');
   localStorage.setItem(NOVA12_PROOF_KEY,JSON.stringify({id,sha256,size:sample.size,created:Date.now(),bootId:NOVA12_BOOT_ID}));
   nova12ProofState='PENDING';
   toast('Тест записан. Теперь закрой и заново открой Safari.');
 }catch(err){
   try{await remove(id)}catch{}
   nova12ProofState='FAIL';
   toast('Запись не выполнена: '+err.message);
 }finally{state.busy=false;nova12RefreshProofUI()}
}
async function nova12VerifyProof(){
 if(state.busy)return;
 const marker=nova12ProofMarker();
 if(!marker){toast('Сначала начни проверку');nova12RefreshProofUI();return}
 if(marker.bootId===NOVA12_BOOT_ID){toast('Сначала закрой и повторно открой страницу Safari');return}
 state.busy=true;
 try{
   const saved=await getRow(marker.id);
   if(!saved?.probe||!saved?.audio)throw Error('Тестовая запись исчезла из IndexedDB');
   if(saved.audio.size!==marker.size)throw Error('Размер сохранённого файла изменился');
   const sha=await hashBlob(saved.audio);
   if(sha!==marker.sha256)throw Error('SHA-256 не совпадает: аудио повреждено');
   await remove(marker.id);
   if(await getRow(marker.id))throw Error('Не удалось удалить временные данные');
   localStorage.removeItem(NOVA12_PROOF_KEY);
   nova12ProofState='PASS';
   toast('PASS · Сохранность аудио при повторном открытии подтверждена');
 }catch(err){
   nova12ProofState='FAIL';
   toast('FAIL · '+err.message);
 }finally{state.busy=false;nova12RefreshProofUI()}

 }

 const audioBlob=new Blob([fileBuffer],{type:file.type||({wav:'audio/wav',mp3:'audio/mpeg',m4a:'audio/mp4',mp4:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',flac:'audio/flac'}[suffix]||'audio/mp4')});
 const blobUrl=URL.createObjectURL(audioBlob);

// NOVA 011 backup remains compatible with NOVA 009 / v9 backups.
// Strong checksum is an additive field; old archives without it remain readable.
async function backup(){
  if(state.busy)return;
  state.busy=true;
  toast('Подготавливаем резервную копию…');
  try{
    const total=state.songs.reduce((n,s)=>n+(s.audio?.size||0),0);
    if(total>150*1048576)throw Error('Суммарный размер аудио больше 150 МБ. Сохрани большие файлы отдельно.');
    const records=[];
    for(const s of state.songs){
      const {audio,...meta}=s;
      const entry={...meta,audioBase64:audio?await fileBase64(audio):null};
      if(audio)entry.audioSha256=await hashBlob(audio);
      records.push(entry);
    }
    const archive=new Blob([JSON.stringify({format:'nova-studio-backup',version:9,created:new Date().toISOString(),integrity:'sha256-per-audio-v11',records})],{type:'application/json'});
    downloadBlob(archive,'NOVA_FULL_BACKUP_'+new Date().toISOString().slice(0,10)+'.json');
    toast('Копия готова: '+records.length+' проектов, с проверкой SHA-256');
  }catch(e){toast('Резервная копия: '+e.message)}finally{state.busy=false}
}
async function restore(file){
  if(!file||state.busy)return;
  if(file.size>210*1048576){toast('Архив больше 210 МБ');return}
  state.busy=true;
  toast('Проверяем весь архив перед восстановлением…');
  try{
    const data=JSON.parse(await file.text());
    if(data.format!=='nova-studio-backup'||data.version!==9||!Array.isArray(data.records)||data.records.length>1000)throw Error('Неверный формат архива NOVA');
    const existing=new Set((await getAll()).map(s=>s.id));
    const internalIds=new Set();
    const remappedIds=new Map();
    const rows=[];
    let totalBytes=0,duplicates=0;
    for(const raw of data.records){
      if(!raw||typeof raw!=='object'||Array.isArray(raw)||typeof raw.id!=='string'||!raw.id||raw.id.length>128||typeof raw.title!=='string'||!raw.title.trim()||raw.title.length>200)throw Error('Некорректная запись в архиве');
      if(internalIds.has(raw.id))throw Error('Повторяющийся ID в архиве');
      internalIds.add(raw.id);
      if(raw.audioBase64!=null&&typeof raw.audioBase64!=='string')throw Error('Некорректное поле аудио');
      let audio=null;
      if(raw.audioBase64){
        const estimated=raw.audioBase64.length*3/4;
        if(estimated>100*1048576)throw Error('Слишком большой трек в архиве');
        totalBytes+=estimated;
        if(totalBytes>150*1048576)throw Error('Превышен общий размер аудио');
        const bytes=decodeBase64(raw.audioBase64);
        audio=new Blob([bytes],{type:typeof raw.mediaType==='string'&&raw.mediaType.startsWith('audio/')?raw.mediaType:'audio/mp4'});
        if(raw.audioSha256){
          if(!/^[0-9a-f]{64}$/i.test(raw.audioSha256))throw Error('Некорректная контрольная сумма');
          if((await hashBlob(audio)).toLowerCase()!==raw.audioSha256.toLowerCase())throw Error('Ошибка SHA-256: аудиофайл повреждён');
        }
      }
      const {audioBase64,audioSha256,...meta}=raw;
      let id=raw.id,title=trim(raw.title,85);
      if(existing.has(id)){
        duplicates++;
        do{id=sid()}while(existing.has(id));
        title=trim(title+' (из копии)',85);
      }
      existing.add(id);
      remappedIds.set(raw.id,id);
      rows.push({...meta,id,title,created:Number.isFinite(Number(raw.created))?Number(raw.created):Date.now(),audio});
    }
    for(const row of rows){if(row.rootProjectId&&remappedIds.has(row.rootProjectId))row.rootProjectId=remappedIds.get(row.rootProjectId)}
    // A failed transaction rolls back ALL imported records.
    await putBatchAtomic(rows);
    await reload();
    go('library');
    toast('Восстановлено: '+rows.length+(duplicates?' · без замены существующих: '+duplicates:''));
  }catch(e){toast('Архив отклонён до записи: '+e.message)}finally{state.busy=false}
}

function coreVoice(){
  if(novaRecognition){try{novaRecognition.stop()}catch{} return}
  if(!CoreSpeech){go('create');toast('Распознавание речи недоступно в этом Safari. Нажми микрофон клавиатуры для диктовки.');requestAnimationFrame(()=>document.getElementById('song-idea')?.focus());return}

    rec.onresult=e=>{
      const heard=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ').trim();

      state.form.idea=[state.form.idea.trim(),heard].filter(Boolean).join(' ').slice(0,1500);

      const input=document.getElementById('song-idea');if(input){input.value=state.form.idea;input.focus()}
      toast('Идея записана. Можно уточнить текст и настройки.');

    };
    rec.onend=()=>{if(novaRecognition===rec)novaRecognition=null;coreVisual(false)};
    rec.start();coreVisual(true);
  }catch(e){novaRecognition=null;coreVisual(false);go('create');toast('Не удалось запустить распознавание. Можно продиктовать идею через клавиатуру iPhone.')}

<script>

  };

  async function qaGet(id){const db=await qaOpen();return new Promise((rs,rj)=>{let q=db.transaction(QA_STORE,'readonly').objectStore(QA_STORE).get(id);q.onsuccess=()=>rs(q.result);q.onerror=()=>rj(q.error||Error('read'))})}

  async function test(key,fn){try{const detail=await fn();if(detail&&typeof detail==='object'&&detail.skip)log(key,'SKIP',detail.skip);else log(key,'PASS',detail||'')}catch(err){log(key,'FAIL',String(err?.message||err))}}
  const ensure=(ok,msg)=>{if(!ok)throw Error(msg)};

    if(!raw.payload || typeof raw.payload!=='object' || raw.payload.id!==raw.song_id || typeof raw.payload.title!=='string' || raw.payload.title.length>150)throw Error('Повреждены метаданные песни');
    if(raw.audio_sha256!==null && raw.audio_sha256!==undefined && !/^[a-f0-9]{64}$/.test(raw.audio_sha256))throw Error('Неверная контрольная сумма аудио');
    if(raw.audio_path && raw.audio_path!==remotePath(raw.song_id))throw Error('Недопустимый путь аудио');
    return true;
  }
  async function cloudList(){let rows=[];for(let off=0;off<5000;off+=100){const r=await request('/rest/v1/nova_songs?select=song_id,payload,audio_path,audio_sha256&order=song_id.asc&limit=100&offset='+off);const part=await r.json();if(!Array.isArray(part))throw Error('Некорректный ответ базы');part.forEach(validateRemote);rows.push(...part);if(part.length<100)break;if(off>=4900)throw Error('Лимит списка 5000, обратись к администратору')}return rows}
  async function hexBlob(blob){if(!crypto?.subtle)throw Error('SHA-256 недоступен');const h=await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());return Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('')}
  async function push(){
    const current=await cloudList();const ids=new Map(current.map(r=>[r.song_id,r]));
    const local=await getAll();let uploaded=0,skipped=0,conflicts=0,totalBytes=0;
    for(const song of local){
      if(!song.id||!/^[A-Za-z0-9_.-]+$/.test(song.id)||song.id.length>128||song.id.startsWith('__nova')){skipped++;continue}
      const old=ids.get(song.id);if(old){
        const localMeta=metaFrom(song); const remoteMeta=old.payload || {};
        const changed=Object.keys(localMeta).some(k=>JSON.stringify(localMeta[k])!==JSON.stringify(remoteMeta[k]));
        if(changed || ((old.audio_sha256||null)!==(song.audioSha256||null) && song.audioSha256))conflicts++;else skipped++;
        continue;
      }
      let audioPath=null,sha=null;
      if(song.audio){
        if(song.audio.size>MAX_SONG)throw Error(`Трек ${song.title}: аудио больше 25 МБ — скачай оригинал отдельно`);
        totalBytes+=song.audio.size;if(totalBytes>MAX_BATCH)throw Error('Лимит пакета 120 МБ, загружено '+uploaded+' треков. Повтори позднее.');
        sha=await hexBlob(song.audio);audioPath=remotePath(song.id);
        try {
          await request('/storage/v1/object/'+BUCKET+'/'+audioPath,{method:'POST',body:song.audio,headers:{'content-type':song.audio.type||'audio/mp4','x-upsert':'false'}});
        } catch(e) {
          if(e.message!=='Запись уже существует')throw e;
          // Storage may already contain a completed upload whose metadata POST failed.
          // Only reuse the object if its entire content has the expected SHA-256.
          const previous = await request('/storage/v1/object/authenticated/'+BUCKET+'/'+audioPath);
          const existing = await previous.blob();
          if(existing.size!==song.audio.size || (await hexBlob(existing))!==sha)
            throw Error('Конфликт аудио в облаке: оригинал не изменён. Требуется ручная проверка.');
        }
      }
      await request('/rest/v1/nova_songs',{method:'POST',headers:{'content-type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({user_id:userId,song_id:song.id,payload:metaFrom(song),audio_path:audioPath,audio_sha256:sha})});
      uploaded++;
    }
    message(`Загрузка завершена: ${uploaded} новых, ${skipped} пропущено, ${conflicts} конфликтов. Оригиналы не удалялись.`);
  }
  async function pull(){
    const remote=await cloudList();const local=await getAll();const ids=new Map(local.map(s=>[s.id,s]));
    const next=[];let conflicts=0,skipped=0,size=0;
    for(const r of remote){
      if(ids.has(r.song_id)){const old=ids.get(r.song_id);if(old.audioSha256&&r.audio_sha256&&old.audioSha256!==r.audio_sha256)conflicts++;else skipped++;continue}
      const row={...r.payload,id:r.song_id};delete row.audioBase64;
      if(r.audio_path){
        const response=await request('/storage/v1/object/authenticated/'+BUCKET+'/'+r.audio_path);
        const blob=await response.blob();size+=blob.size;
        if(blob.size>MAX_SONG||size>MAX_BATCH)throw Error('Лимит скачивания 120 МБ: локальная медиатека не изменена');
        const sha=await hexBlob(blob);if(sha!==r.audio_sha256)throw Error('Ошибка SHA-256: локальная медиатека не изменена');
        row.audio=blob;row.audioSha256=sha;
      }
      next.push(row)
    }
    // Atomic insertion: validated items or nothing. Never overwrite local songs.
    await putBatchAtomic(next);
    await reload();render();show();
    message(`Загружено ${next.length} новых песен, ${skipped} уже есть, ${conflicts} конфликтов. Существующие треки не изменены.`);
  }
  async function perform(action){if(busy)return;busy=true;const controls=element('nova-cloud-controls');if(controls)controls.style.opacity='.65';message('Выполняется проверка…');try{
    if(action==='signup')await login(true);else if(action==='login')await login(false);else if(action==='logout'){sessionSet(null);message('Выход. Музыка осталась на устройстве.')}else if(action==='push')await push();else if(action==='pull')await pull();
  }catch(e){message('Не выполнено: '+safeErr(e))}finally{busy=false;if(controls)controls.style.opacity='';show()}}
  const BASE_STUDIO=studio;
  studio=function(){return BASE_STUDIO()+`<section class="settings-block nova-cloud-block" id="nova-cloud-block" aria-label="Облачная медиатека">
    <h3>Общая медиатека Mac и iPhone</h3>
    <p id="nova-cloud-status">Не подключено — песни хранятся только в этом браузере.</p>
    <p class="smallprint">NOVA не отправляет аудио в облако автоматически. Когда владелец подключит приватное хранилище, можно войти и вручную синхронизировать новые записи. Старые треки никогда не перезаписываются.</p>
    <div id="nova-cloud-auth" hidden><div class="nova-cloud-fields"><label>Email <input id="nova-cloud-email" type="email" autocomplete="email" placeholder="email@example.com"></label><label>Пароль <input id="nova-cloud-password" type="password" autocomplete="current-password" placeholder="Не менее 10 символов"></label></div><div class="btnrow"><button class="cta primary" type="button" data-nova-sync="login">Войти</button><button class="cta secondary" type="button" data-nova-sync="signup">Создать профиль</button></div></div>
    <div id="nova-cloud-controls" hidden><div class="btnrow"><button class="cta primary" type="button" data-nova-sync="push">Загрузить новые песни в облако</button><button class="cta secondary" type="button" data-nova-sync="pull">Скачать новые песни на устройство</button><button class="cta ghost" type="button" data-nova-sync="logout">Выйти</button></div></div>
    <p id="nova-cloud-feedback" class="smallprint" role="status" aria-live="polite"></p>
  </section>`};
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-nova-sync]');if(btn){e.preventDefault();e.stopPropagation();perform(btn.dataset.novaSync)}},true);
  document.addEventListener('DOMContentLoaded',()=>setTimeout(show,40));
  const originalRender=render;
  render=function(){originalRender();show()};
  window.NOVA_SYNC_STATUS=()=>({configured,signedIn:!!token});
})();
</script>
</body>
</html>
